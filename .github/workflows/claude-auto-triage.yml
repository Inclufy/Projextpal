name: Claude Auto-Triage

# Sprint 11 S11-01 — external orchestrator for the Claude Auto-Triage pipeline.
#
# ProjeXtPal signals (see backend/product_issues/claude_triage.py) POST a
# signed JSON payload to GitHub's repository_dispatch endpoint; this workflow
# receives it, asks Claude for a minimal patch via the Anthropic Messages API,
# applies the patch, opens a PR, and reports back to ProjeXtPal's
# /api/v1/product-issues/<id>/claude-callback/ endpoint (HMAC-signed).
#
# Manual trigger (workflow_dispatch) is kept for debugging — paste a JSON
# payload matching the repository_dispatch client_payload shape.

on:
  repository_dispatch:
    types: [claude-auto-triage]
  workflow_dispatch:
    inputs:
      issue_payload:
        description: 'JSON payload (same shape as repository_dispatch client_payload)'
        required: true

concurrency:
  # Serialize per issue_id so a cron retry does not race the first run.
  group: claude-auto-triage-${{ github.event.client_payload.issue_id || github.run_id }}
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use GITHUB_TOKEN for git ops; gh CLI picks it up automatically.
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic==0.39.0 requests==2.32.3

      - name: Run orchestrator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROJEXTPAL_WEBHOOK_SECRET: ${{ secrets.PROJEXTPAL_WEBHOOK_SECRET }}
          PROJEXTPAL_CALLBACK_URL: ${{ secrets.PROJEXTPAL_CALLBACK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # repository_dispatch -> client_payload; workflow_dispatch -> inputs.
          ISSUE_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          ISSUE_PAYLOAD_MANUAL: ${{ github.event.inputs.issue_payload }}
        run: python scripts/orchestrator/run_fix.py
