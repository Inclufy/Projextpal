# Overlay voor een Hetzner-machine waar een CENTRALE Caddy (bv. /opt/caddy,
# gedeeld met andere apps) al 80/443 bezit en naar de app-containers routeert.
# De basis-stack publiceert zelf geen proxy-poorten; deze overlay voegt er
# bewust ook geen toe (tegenhanger van ports.yml, dat 80/443 claimt) zodat de
# bestaande routering onaangeroerd blijft. SITE_ADDRESS hoort dan ":80" te
# zijn: de stack-proxy draait intern mee zonder certificaten aan te vragen.
services:
  proxy:
    labels:
      nl.inclufy.routering: "achter-centrale-caddy"
