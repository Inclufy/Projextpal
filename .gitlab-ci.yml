stages:
  - test
  - build
  - deploy

variables:
  POSTGRES_DB: projextpal_test
  POSTGRES_USER: projextpal
  POSTGRES_PASSWORD: test_password
  POSTGRES_HOST: postgres
  DATABASE_URL: postgresql://projextpal:test_password@postgres:5432/projextpal_test
  DJANGO_SETTINGS_MODULE: core.settings
  # CI-safe defaults for django-decouple env vars without defaults in settings.py
  SECRET_KEY: ci-test-secret-key-not-for-production
  DEBUG: "True"
  EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
  EMAIL_HOST: localhost
  EMAIL_PORT: "25"
  EMAIL_HOST_USER: ""
  EMAIL_HOST_PASSWORD: ""
  DEFAULT_FROM_EMAIL: ci@projextpal.com
  FRONTEND_URL: http://localhost:3000
  BASE_URL: http://localhost:8000
  STRIPE_SECRET_KEY: sk_test_ci_placeholder
  STRIPE_PUBLIC_KEY: pk_test_ci_placeholder
  STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
  OPENAI_API_KEY: sk-ci-placeholder

build:mobile:
  stage: test
  image: node:20
  cache:
    key: mobile-${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
  script:
    - npm ci
    - npx expo export --platform ios
  only:
    - master
    - main
    - merge_requests

test:backend:
  stage: test
  image: python:3.11
  services:
    - postgres:14
  before_script:
    - cd backend
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - python manage.py migrate --noinput
    - python manage.py check
    - pytest -v --cov=. --cov-report=xml --cov-report=term
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
  only:
    - master
    - main
    - merge_requests

build:backend:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE/backend:latest -t $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA ./backend
    - docker push $CI_REGISTRY_IMAGE/backend:latest
    - docker push $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA
  only:
    - master
    - main

build:frontend:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin $CI_REGISTRY
  script:
    # Dockerfile.prod, niet de standaard Dockerfile. Die laatste is de
    # ontwikkelvariant: hij zet VITE_BACKEND_URL op een relatief pad, kent geen
    # Sentry, en schrijft er inline een nginx-config zonder Cache-Control.
    #
    # Dat laatste is BUG-034, en de reden staat uitgeschreven in Dockerfile.prod
    # zelf: zonder Cache-Control cachet de browser index.html, die verwijst na een
    # redeploy naar bundle-hashes die niet meer bestaan, nginx valt via try_files
    # terug op index.html, en de browser blokkeert dat op een MIME-mismatch. De
    # gebruiker ziet een witte pagina. frontend/nginx-spa.conf lost dat op en zit
    # alleen in Dockerfile.prod.
    #
    # De GitHub-workflow bouwde al zo; deze pipeline niet, waardoor het image in
    # de GitLab-registry sinds 30 augustus 2026 die bug weer bevatte.
    - >
      docker build
      -f frontend/Dockerfile.prod
      --build-arg VITE_SENTRY_DSN="$VITE_SENTRY_DSN"
      --build-arg VITE_APP_VERSION="$CI_COMMIT_SHA"
      --build-arg SENTRY_AUTH_TOKEN="$SENTRY_AUTH_TOKEN"
      -t $CI_REGISTRY_IMAGE/frontend:latest
      -t $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA
      ./frontend
    - docker push $CI_REGISTRY_IMAGE/frontend:latest
    - docker push $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA
  only:
    - master
    - main

# deploy blijft handmatig. Elke commit hoort een image op te leveren, maar niet elke
# commit hoort productie te vervangen. De twee builds hierboven stonden tot 30 augustus
# 2026 ook op handmatig en zijn daardoor nooit gedraaid: het image dat toen in productie
# draaide was met de hand op de Mac Studio gebouwd, arm64, en bestond in geen enkele
# registry. Een build die een knop nodig heeft, is een build die niet gebeurt.
# ============================================================================
# Uitrollen. Drie omgevingen, één sjabloon.
#
#   test        elke commit op master, automatisch
#   staging     met de hand vrijgeven. Klanten richten hier in en trainen hier
#               voor de livegang, dus dit is geen wegwerp-omgeving.
#   production  met de hand vrijgeven, na staging.
#
# De vorige versie van deze job heeft precies één keer echt gedraaid, op
# 9 augustus 2026, en faalde op de eerste regel van het before_script:
#
#     Error loading key "(stdin)": error in libcrypto: unsupported
#
# GitLab mangelt de regeleindes van een meerregelige variabele, waardoor de
# PEM-sleutel onbruikbaar aankomt. Op branch `main` was dat op 28 juli al
# opgelost door de sleutel als base64 op te slaan; master heeft die fix nooit
# gekregen, en omdat alle deploy-jobs op manual stonden is het nooit opgevallen.
#
# Variabelen per omgeving zet je in GitLab met een environment-scope
# (Settings, CI/CD, Variables, kolom Environments). Zo wijst DEPLOY_HOST bij
# `production` naar Hetzner en bij `test` naar de Studio, zonder dat er drie
# bijna gelijke jobs met andere namen ontstaan.
#
#   SSH_PRIVATE_KEY_B64  base64 van de private deploy-sleutel   (protected, masked)
#   SSH_KNOWN_HOSTS      uitvoer van ssh-keyscan op de doelmachine
#   DEPLOY_USER          gebruiker op de doelmachine
#   DEPLOY_HOST          hostnaam of IP
#   DEPLOY_PATH          map op de doelmachine, bv. /srv/projextpal
#   HEALTH_URL           volledig adres van /health/simple/ voor de controle
#
# Het adres, de poort en de robots-instelling staan niet hier maar in
# .env.<omgeving> op de doelmachine zelf, naast de secrets. Zie
# deploy/hetzner/env.example.
# ============================================================================
.deploy:
  stage: deploy
  image: alpine:latest
  variables:
    SSH_OPTS: "-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -i /root/.ssh/id_deploy"
  before_script:
    - apk add --no-cache openssh-client curl
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - |
      if [ -n "${SSH_PRIVATE_KEY_B64:-}" ]; then
        echo "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_deploy
      elif [ -n "${SSH_PRIVATE_KEY:-}" ]; then
        printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
      else
        echo "Geen SSH_PRIVATE_KEY_B64 en geen SSH_PRIVATE_KEY ingesteld."; exit 1
      fi
    - chmod 600 ~/.ssh/id_deploy
    # Hier faalde 9 augustus. Nu met een eigen foutmelding, vóór de eerste
    # verbinding, zodat je ziet wat er mis is en niet alleen dat er iets mis is.
    - |
      if ! ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null 2>&1; then
        echo "De deploy-sleutel is onleesbaar. Vrijwel altijd zijn de regeleindes"
        echo "gesneuveld: sla hem op als base64 in SSH_PRIVATE_KEY_B64."
        echo "  base64 -i ~/.ssh/id_deploy | tr -d '\n' | pbcopy"
        exit 1
      fi
    - |
      if [ -z "${SSH_KNOWN_HOSTS:-}" ]; then
        echo "SSH_KNOWN_HOSTS is leeg. Vul hem met: ssh-keyscan -H $DEPLOY_HOST"
        exit 1
      fi
    - printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "Uitrollen van $CI_COMMIT_SHORT_SHA naar $ENV_NAME op $DEPLOY_HOST:$DEPLOY_PATH"
    - ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH/deploy/caddy' '$DEPLOY_PATH/deploy/hetzner' '$DEPLOY_PATH/deploy/studio' '$DEPLOY_PATH/tests/regression' '$DEPLOY_PATH/backups/$ENV_NAME'"
    # De compose mount deze paden, dus ze moeten naast het compose-bestand staan
    # en bij deze commit horen. De runner heeft de juiste commit al uitgechecked,
    # dus de server heeft geen kopie van de repo nodig en dus ook geen deploy key.
    - scp $SSH_OPTS docker-compose.stack.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
    - scp $SSH_OPTS deploy/caddy/Caddyfile "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/deploy/caddy/"
    - scp $SSH_OPTS "$COMPOSE_OVERLAY" "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/$COMPOSE_OVERLAY"
    - scp $SSH_OPTS tests/regression/known_issues.json "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/tests/regression/"
    - |
      ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "
        set -e
        cd '$DEPLOY_PATH'
        test -f '.env.$ENV_NAME' || { echo \"Er staat geen .env.$ENV_NAME op de server. Zie deploy/hetzner/env.example.\"; exit 1; }
        # Eigen dockerconfig, buiten de sleutelhanger van de ingelogde gebruiker
        # om. Op macOS schrijft Docker Desktop de inloggegevens van de registry
        # naar de login-keychain, en een ssh-sessie kan daar niet bij:
        #   'keychain cannot be accessed because the current session does not
        #    allow user interaction'
        # Met een eigen DOCKER_CONFIG staan ze in een bestand en werkt het wel.
        export DOCKER_CONFIG='$DEPLOY_PATH/.docker'
        export ENV_NAME='$ENV_NAME'
        export PXP_TAG='$CI_COMMIT_SHORT_SHA'
        docker compose -p 'projextpal-$ENV_NAME' --env-file '.env.$ENV_NAME' \
          -f docker-compose.stack.yml -f '$COMPOSE_OVERLAY' pull
        docker compose -p 'projextpal-$ENV_NAME' --env-file '.env.$ENV_NAME' \
          -f docker-compose.stack.yml -f '$COMPOSE_OVERLAY' up -d --remove-orphans
        docker image prune -f
      "
    # Een groene deploy die een stukke omgeving achterlaat is geen groene deploy.
    - |
      echo "Controleren of $HEALTH_URL antwoordt"
      for poging in $(seq 1 10); do
        antwoord=$(curl -fsS --max-time 10 "$HEALTH_URL" 2>/dev/null || true)
        if [ -n "$antwoord" ]; then
          echo "$antwoord"
          echo "$ENV_NAME antwoordt."
          exit 0
        fi
        echo "  poging $poging van 10, nog geen antwoord"
        sleep 15
      done
      echo "De containers draaien, maar $HEALTH_URL antwoordt niet."
      echo "Kijk op de doelmachine met:"
      echo "  docker compose -p projextpal-$ENV_NAME -f docker-compose.stack.yml -f $COMPOSE_OVERLAY logs --tail 50"
      exit 1

# Elke commit op master. Draait op de eigen runner, want de Studio staat niet
# open naar internet.
deploy:test:
  extends: .deploy
  tags: [inclufy]
  variables:
    ENV_NAME: test
    COMPOSE_OVERLAY: deploy/studio/ports.yml
  environment:
    name: test
    url: https://test.projextpal.com
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: on_success

# Vrijgeven met de hand. Klanten richten hier in en trainen hier, dus deze
# omgeving hoort niet bij elke commit om te vallen.
deploy:staging:
  extends: .deploy
  variables:
    ENV_NAME: staging
    COMPOSE_OVERLAY: deploy/hetzner/ports.yml
  environment:
    name: staging
    url: https://staging.projextpal.com
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: manual
      allow_failure: false

deploy:production:
  extends: .deploy
  variables:
    # De draaiende stack op de server heet 'projextpal-productie' en leest
    # .env.productie — ENV_NAME moet daarop aansluiten, anders start compose
    # een tweede stack naast de bestaande.
    ENV_NAME: productie
    # De centrale Caddy op de server bezit 80/443 (gedeeld met iq-helix);
    # deze overlay laat de stack-proxy meedraaien zonder die poorten te claimen.
    COMPOSE_OVERLAY: deploy/hetzner/achter-centrale-caddy.yml
    HEALTH_URL: https://projextpal.com/api/v1/health/
  environment:
    name: production
    url: https://projextpal.com
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: manual
      allow_failure: false
