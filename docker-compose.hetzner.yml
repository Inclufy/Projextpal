# ProjeXtPal, productie op een Hetzner-machine (amd64, Linux).
#
# Verschillen met docker-compose.production.yml, dat op de Mac Studio mikte:
#
#   1. Caddy in plaats van nginx. Caddy haalt en verlengt de certificaten zelf,
#      dus er is geen Cloudflare-tunnel meer nodig om aan https te komen.
#   2. Het frontend-image komt uit de GitLab-registry in plaats van ghcr, zodat
#      backend en frontend uit dezelfde registry komen en één pipeline ze bouwt.
#   3. Alle images zijn vastgezet op ${PXP_TAG}. Een deploy is daardoor te
#      herhalen en terug te draaien: zet PXP_TAG op de vorige commit-sha.
#      `latest` is bewust geen standaard hier; zie deploy/hetzner/README.md.
#
# Starten:  PXP_TAG=<commit-sha> docker compose -f docker-compose.hetzner.yml up -d
# Secrets:  .env naast dit bestand, zie deploy/hetzner/env.example

services:
  postgres:
    image: postgres:15-alpine
    container_name: projextpal-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-projextpal}
      POSTGRES_USER: ${POSTGRES_USER:-projextpal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ontbreekt in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks: [projextpal-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-projextpal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: projextpal-redis-prod
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD ontbreekt in .env}"]
    volumes:
      - redis_data:/data
    networks: [projextpal-network]
    # Met requirepass antwoordt een kale `redis-cli ping` met NOAUTH en faalt
    # de check. Het wachtwoord moet dus mee.
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  backend:
    image: registry.gitlab.com/inclufy/projextpal/backend:${PXP_TAG:?PXP_TAG ontbreekt, zet de commit-sha die je wilt uitrollen}
    container_name: projextpal-backend-prod
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
      # Het regressie-overzicht staat in de repo-root, buiten de COPY-context
      # van backend/Dockerfile, dus het wordt hier gemount.
      - ./tests/regression/known_issues.json:/app/tests/regression/known_issues.json:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [projextpal-network]
    command: >
      sh -c "python3 manage.py migrate --noinput &&
             python3 manage.py collectstatic --noinput &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8001 --workers 4 --timeout 120"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/health/simple/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s

  frontend:
    image: registry.gitlab.com/inclufy/projextpal/frontend:${PXP_TAG:?PXP_TAG ontbreekt, zet de commit-sha die je wilt uitrollen}
    container_name: projextpal-frontend-prod
    restart: unless-stopped
    networks: [projextpal-network]

  caddy:
    image: caddy:2-alpine
    container_name: projextpal-caddy-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN ontbreekt in .env}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL ontbreekt in .env}
    volumes:
      - ./deploy/hetzner/Caddyfile:/etc/caddy/Caddyfile:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
      # caddy_data bewaart de certificaten. Raakt dit volume weg, dan vraagt
      # Caddy alles opnieuw aan bij Let's Encrypt en loop je tegen hun
      # snelheidslimiet aan. Neem het mee in de back-up.
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [backend, frontend]
    networks: [projextpal-network]

networks:
  projextpal-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  static_files:
  media_files:
  caddy_data:
  caddy_config:
